<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5">
<title>从零推导英语句子语法</title>
<meta name="description" content="面向中文母语者的英语语法第一性原理推导">
<link rel="stylesheet" href="assets/vue.css">
<link rel="stylesheet" href="assets/reader.css">
<script>
  /* 在页面绘制前先套用已保存的主题，避免闪白 */
  try { var s = JSON.parse(localStorage.getItem('grammar-reader-v1') || '{}');
    if (s.theme && s.theme !== 'auto') document.documentElement.setAttribute('data-theme', s.theme);
    if (s.fs) document.documentElement.style.setProperty('--fs', s.fs + 'px');
    if (s.lh) document.documentElement.style.setProperty('--lh', s.lh);
  } catch (e) {}
</script>
</head>
<body class="hl">
<div id="app">加载中……</div>
<script>
  window.$docsify = {
    name: '英语语法从零推导',
    loadSidebar: true,
    subMaxLevel: 2,
    auto2top: true,
    search: { placeholder: '搜索', noData: '没有结果', depth: 3 },
    copyCode: { buttonText: '复制', successText: '已复制' }
  };
</script>
<script src="assets/reader.js"></script>
<script src="assets/docsify.min.js"></script>
<script src="assets/search.min.js"></script>
<script src="assets/docsify-copy-code.min.js"></script>
</body>
</html>
